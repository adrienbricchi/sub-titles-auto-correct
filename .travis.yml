language: python
sudo: false
notifications:
    email:
        on_success: never
        on_failure: never

python:
    - "3.6"
    - "3.7"
    - "3.8"
    - "3.9"
    - "3.10"
    - "3.11"

install:
    - pip install -e .
    - pip install coveralls pytest pytest-cov

before_script:
    - export PYTHONPATH=$PYTHONPATH:$(pwd)/src

script:
    - coverage run --source=src/subtitles_auto_correct -m pytest tests/ --verbose

after_success:
    - coveralls